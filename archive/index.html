<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOX — Minimal File Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Inline SVG Icon Sprite (Zero Runtime Libraries) -->
  <svg style="display: none;">
    <symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    <symbol id="icon-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="icon-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></symbol>
    <symbol id="icon-pdf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></symbol>
    <symbol id="icon-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></symbol>
    <symbol id="icon-zip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 21h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-7"/><path d="M5 3h5v18H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><line x1="7" y1="6" x2="7" y2="6.01"/><line x1="7" y1="9" x2="7" y2="9.01"/><line x1="7" y1="12" x2="7" y2="12.01"/><line x1="7" y1="15" x2="7" y2="15.01"/></symbol>
    <symbol id="icon-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="icon-github" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
    <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
  </svg>

  <div class="app-shell">
    <!-- Header -->
    <header class="app-header" role="banner">
      <div class="header-left">
        <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar" aria-expanded="false">
          <svg class="icon"><use href="#icon-menu"></use></svg>
        </button>
        <div class="header-brand">
          <svg class="icon brand-icon"><use href="#icon-folder"></use></svg>
          <span class="brand-title">BOX</span>
        </div>
      </div>

      <div class="search-box" role="search">
        <svg class="icon search-icon"><use href="#icon-search"></use></svg>
        <input type="text" id="search-input" placeholder="Search files in current view..." aria-label="Search files" />
      </div>

      <div class="header-actions">
        <button id="view-toggle-btn" class="icon-btn" title="Toggle Grid/List View" aria-label="Toggle Layout View">
          <svg class="icon"><use href="#icon-grid"></use></svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <svg class="icon"><use href="#icon-sun"></use></svg>
        </button>
      </div>
    </header>

    <!-- Body: Sidebar + Main Content -->
    <div class="app-body">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar" role="navigation" aria-label="Folder navigation">
        <div class="sidebar-header">
          <span class="sidebar-title">Folders</span>
        </div>
        <nav class="folder-tree" id="folder-tree" role="tree"></nav>
        <div class="sidebar-footer">
          <a href="#path=" class="sidebar-quicklink" data-path="">
            <svg class="icon"><use href="#icon-home"></use></svg>
            <span>Home</span>
          </a>
          <a href="#favorites" class="sidebar-quicklink" id="favorites-link">
            <svg class="icon"><use href="#icon-star"></use></svg>
            <span>Favorites</span>
          </a>
        </div>
      </aside>

      <!-- Sidebar overlay for mobile -->
      <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

      <!-- Main Content -->
      <main class="main-content" id="main-content" role="main">
        <div class="content-header">
          <nav class="breadcrumbs" id="breadcrumbs-nav" aria-label="Breadcrumb"></nav>
          <div class="content-actions">
            <label for="sort-select" class="sr-only">Sort By</label>
            <select id="sort-select" aria-label="Sort files">
              <option value="name-asc">Name (A-Z)</option>
              <option value="name-desc">Name (Z-A)</option>
              <option value="size-desc">Size (Largest)</option>
              <option value="size-asc">Size (Smallest)</option>
            </select>
          </div>
        </div>

        <div class="file-grid-container">
          <div id="file-grid" class="file-grid view-grid" role="list"></div>
          <div id="status-message" class="status-message hidden" aria-live="polite"></div>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer" role="contentinfo">
      <div id="storage-info" class="footer-info">Connected to GitHub</div>
      <a id="repo-link" href="#" target="_blank" rel="noopener noreferrer" class="repo-link">
        <svg class="icon inline-icon"><use href="#icon-github"></use></svg>
        <span>View Repository</span>
      </a>
    </footer>
  </div>

  <!-- Preview Modal -->
  <div id="preview-modal" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="preview-title">
    <div class="modal-content preview-content">
      <div class="modal-header">
        <h2 id="preview-title">File Preview</h2>
        <div class="header-actions">
          <a id="preview-download-btn" class="btn btn-secondary btn-sm" download target="_blank" rel="noopener">
            <svg class="icon inline-icon"><use href="#icon-download"></use></svg> Download
          </a>
          <button id="close-preview-btn" class="icon-btn" aria-label="Close preview"><svg class="icon"><use href="#icon-close"></use></svg></button>
        </div>
      </div>
      <div id="preview-body" class="modal-body preview-body">
        <!-- Dynamic content injected by preview.js -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="cache.js"></script>
  <script src="github.js"></script>
  <script src="preview.js"></script>
  <script src="search.js"></script>
  <script src="router.js"></script>
  <script src="ui.js"></script>
</body>
</html>
